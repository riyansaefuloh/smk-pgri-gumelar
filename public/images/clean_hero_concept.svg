    <text x="358" y="38.5" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#0968F6">Tahun Ajaran 2026/2027</text>
  </g>

  <!-- SVG Filters for Crisp Micro-Depth Shadows (No AI blur mess) -->
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>
</svg>
