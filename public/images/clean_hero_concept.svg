  <g filter="url(#cardShadow)">
    <rect x="330" y="20" width="140" height="30" rx="15" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="345" cy="35" r="7" fill="#ECF3FE"/>
