    <text x="436" y="164" font-family="'Inter', sans-serif" font-size="8.5" font-weight="500" fill="#D99A27">Alumni Terserap Kerja</text>
    <rect x="436" y="171" width="70" height="3" rx="1.5" fill="#E2E8F0"/>
  </g>

