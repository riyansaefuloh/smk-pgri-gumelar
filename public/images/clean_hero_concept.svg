    <circle cx="67" cy="168" r="4" stroke="#E11D48" stroke-width="1.8" fill="none"/>

    <text x="88" y="171" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#1F1F1F">Bengkel TEFA</text>
    <text x="88" y="184" font-family="'Inter', sans-serif" font-size="8.5" font-weight="500" fill="#E11D48">Teknik Sepeda Motor</text>
    <rect x="88" y="191" width="68" height="3" rx="1.5" fill="#E2E8F0"/>
  </g>

