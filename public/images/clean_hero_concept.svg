    <path d="M 404 155.5 V 162 C 404 164, 407 166, 410 166 C 413 166, 416 164, 416 162 V 155.5" stroke="#D99A27" stroke-width="1.5" fill="none"/>
    <path d="M 418 154 V 163" stroke="#D99A27" stroke-width="1.5" stroke-linecap="round"/>

